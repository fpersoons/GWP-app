<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005D83">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GWP">
  <title>GWP — Évaluation des Bonnes Pratiques d’Entreposage</title>
  <script>
    // Les chemins de l'application sont relatifs : si l'URL est /GWP-app (sans barre finale, via le portail),
    // on la normalise en /GWP-app/ pour que css/, js/ et sw.js se résolvent correctement.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><p style="padding:2rem;text-align:center;color:#56565A;font-size:12px">Chargement…</p></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
